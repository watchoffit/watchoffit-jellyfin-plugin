version: "1.0.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Sync your Jellyfin playback with Watchoffit in real time, without API keys or webhooks."
imageUrl: "https://raw.githubusercontent.com/watchoffit/watchoffit-jellyfin-plugin/v1.0.0.0/assets/watchoffit.png"
description: >
  Pairs a Jellyfin server with a Watchoffit instance over a custom protocol. Once
  paired, every playback_start / playback_progress / playback_stop / user_data
  event is forwarded to Watchoffit, and Watchoffit's outbound watched/unwatched
  changes are applied back to Jellyfin. Replaces the Webhook plugin, the
  user-managed API key, and the Quick Connect flow.
category: "Sync"
owner: "watchoffit"
artifacts:
- "Jellyfin.Plugin.Watchoffit.dll"
changelog: >
  Adds Watchoffit pairing, durable connection state, playback and watched-state
  sync, inventory publishing, backfill, reconciliation, outbound watched and
  unwatched commands, and durable event delivery for Jellyfin 10.11.
